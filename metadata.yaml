name: astrbot_plugin_video_watcher
display_name: 视频观察员
short_desc: 让 AI 能「看」视频：支持视频文件、B站链接和QQ分享卡片
desc: >-
  默认情况下，AstrBot 收到视频只会把文件路径告诉模型，模型本身看不到画面。
  本插件用 ffmpeg 按每秒 1 帧（每分钟 60 帧）抽取画面，分批交给视觉模型分析，
  从而让机器人能够「看懂」视频里的大致场景、人物、动作和画面文字。
  支持下载 B 站普通视频链接、b23.tv 短链接及 QQ 分享卡片中的视频，
  也支持引用其他人发送的视频或分享消息。
  看视频命令的最终回复使用当前会话的人格和聊天上下文。
help: |-
  用法：
  1. 发送视频时同时发 /看视频
  2. 发送 /看视频 B站链接（支持 b23.tv 短链接）
  3. 或引用一条视频、B站链接/分享卡片消息，再发 /看视频
  4. 正常唤醒机器人后，也可由模型按需调用 describe_video 工具

  每秒抽 1 帧，每分钟约 60 帧；分批分析后用当前人格回复。
  不分析声音，快速动作可能发生在两帧之间；长视频耗时和模型用量会增加。
version: 0.3.1
author: 无音
repo: https://github.com/wuyinhh/astrbot_plugin_video_watcher
astrbot_version: ">=4.24.0"
tags:
  - 视频
  - 视觉
  - 多模态
  - B站
